<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 积分过期日历</title>
<link rel="stylesheet" href="calendar.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Agent 积分过期日历</h1>
      <div class="sub" id="modeTag">加载中…</div>
    </div>
    <div class="hdr-right">
      <div class="fresh" id="fresh"></div>
      <button id="btnAuth">授权与样本</button>
      <button id="sync" class="primary" title="逐个平台抓一次活数据；没装常驻钩子的平台会临时装一次，读完立刻注销">立即同步</button>
      <a href="https://github.com/LiarrDev/agent-credit-calendar" target="_blank" rel="noopener" class="gh-link" title="在 GitHub 查看源码" aria-label="在 GitHub 查看源码"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg></a>
    </div>
  </header>

  <div id="notice"></div>

  <div class="cards" id="cards"></div>

  <div class="main">
    <div class="panel">
      <div class="cal-head">
        <div class="mo" id="moTitle"></div>
        <div class="nav">
          <button class="mini" id="prev">←</button>
          <button class="mini" id="today">回到今天</button>
          <button class="mini" id="next">→</button>
        </div>
      </div>
      <div class="dow"><i style="color:#a9b2c2">日</i><i>一</i><i>二</i><i>三</i><i>四</i><i>五</i><i style="color:#a9b2c2">六</i></div>
      <div class="grid" id="grid"></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="rail">
      <div class="panel">
        <div class="sec-h">
          <h3>即将到期</h3>
          <span class="thr">阈值 <select id="thr"><option value="3" selected>3 天</option><option value="7">7 天</option><option value="14">14 天</option><option value="30">30 天</option></select></span>
        </div>
        <div class="sec-b" id="upcoming"></div>
      </div>

      <div class="panel" id="detail"></div>
    </div>
  </div>

  <footer id="foot"></footer>
</div>

<!-- 授权与样本 -->
<div class="modal" id="mAuth">
  <div class="box">
    <h2>授权与捕获样本</h2>
    <div class="body" id="authBody"></div>
    <div class="foot">
      <button id="expCap" title="导出内容含平台响应体，可能带账号标识；分享前请先脱敏">导出捕获样本</button>
      <button id="expDoc" title="导出内容包含捕获样本，可能带账号标识；不要上传到公开仓库">导出全部数据</button>
      <button class="primary" id="closeAuth">完成</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../lib/agents.js"></script>
<script src="../lib/normalize.js"></script>
<script src="../lib/diagnose.js"></script>
<script src="../lib/store.js"></script>
<script src="calendar.js"></script>
</body>
</html>
